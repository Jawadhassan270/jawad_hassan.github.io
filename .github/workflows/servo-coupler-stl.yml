name: Generate servo coupler STL presets

on:
  push:
    branches: [main]
    paths:
      - 'servo-shaft-coupler/servo_shaft_coupler.scad'
      - '.github/workflows/servo-coupler-stl.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-stl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSCAD
        run: sudo apt-get update && sudo apt-get install -y openscad
      - name: Render four presets
        run: |
          mkdir -p servo-shaft-coupler/STL
          for diameter in 6 8; do
            for shape in Round D-Shaped; do
              suffix=Round
              if [ "$shape" = "D-Shaped" ]; then suffix=D_Shaft; fi
              openscad -o "servo-shaft-coupler/STL/SG90_${suffix}_${diameter}mm.stl" \
                -D 'servo_preset="SG90TP"' \
                -D "shaft_type=\"$shape\"" \
                -D "shaft_diameter=$diameter" \
                servo-shaft-coupler/servo_shaft_coupler.scad
            done
          done
      - name: Commit generated STL files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add servo-shaft-coupler/STL/*.stl
          if ! git diff --cached --quiet; then
            git commit -m "Build ready-to-print servo coupler STL presets"
            git push
          fi
